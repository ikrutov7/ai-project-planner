app = "ai-project-planner-ikrutov"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PLANNER_CORS_ORIGINS = "*"
  PLANNER_SERVE_FRONTEND = "true"
  PLANNER_AGENT_DEMO_MODE = "true"
  PLANNER_DATABASE_URL = "sqlite:////data/planner.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "planner_data"
  destination = "/data"
