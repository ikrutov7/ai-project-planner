# Platform demo: single container with UI + API + seed-on-boot + sample Excel.
# Usage: make demo-up

services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-project-planner:demo
    ports:
      - "8000:8000"
    environment:
      PLANNER_DATABASE_URL: sqlite:////data/planner.db
      PLANNER_CORS_ORIGINS: "*"
      PLANNER_SERVE_FRONTEND: "true"
      PLANNER_AGENT_DEMO_MODE: "true"
      # Optional LLM for real agent (otherwise demo heuristic agent):
      # PLANNER_LLM_API_KEY: sk-...
      # LLM_API_KEY: sk-...
      # LLM_MODEL: gpt-4o-mini
    volumes:
      - planner-demo-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  planner-demo-data:
